<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scans — Admin</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #101110; color: #e8e6e1; }
  header { padding: 20px 24px; border-bottom: 1px solid #2a2b29; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  .meta { color: #9a9790; font-size: 13px; margin-top: 4px; font-family: ui-monospace, monospace; }
  button, .btn { background: #1c1d1b; color: #e8e6e1; border: 1px solid #2f302e; border-radius: 6px; padding: 8px 14px; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-block; }
  button:hover, .btn:hover { background: #242523; }
  main { padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .card { background: #161716; border: 1px solid #2a2b29; border-radius: 8px; overflow: hidden; }
  .card img { width: 100%; height: auto; display: block; background: #0a0a0a; cursor: pointer; }
  .card .row { padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .name { font-size: 11px; font-family: ui-monospace, monospace; color: #9a9790; word-break: break-all; }
  .empty { color: #9a9790; padding: 48px 24px; text-align: center; font-size: 14px; }
  .error { color: #f0a08a; padding: 12px 24px; font-size: 13px; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: none; align-items: flex-start; justify-content: center; padding: 24px; overflow: auto; z-index: 50; }
  .modal-backdrop.open { display: flex; }
  .modal { width: min(1180px, 100%); background: #141514; border: 1px solid #2a2b29; border-radius: 10px; overflow: hidden; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #2a2b29; }
  .modal-head .title { font-size: 13px; font-family: ui-monospace, monospace; color: #cfcac0; word-break: break-all; }
  .modal-body { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(360px, 1.15fr); }
  @media (max-width: 880px) { .modal-body { grid-template-columns: 1fr; } }
  .modal-img { padding: 16px; border-right: 1px solid #2a2b29; background: #0d0d0c; display: flex; align-items: flex-start; justify-content: center; }
  @media (max-width: 880px) { .modal-img { border-right: 0; border-bottom: 1px solid #2a2b29; } }
  .modal-img img { max-width: 100%; height: auto; border-radius: 6px; border: 1px solid #232422; }
  .modal-info { padding: 16px; max-height: 78vh; overflow: auto; }
  .section { margin-bottom: 14px; }
  .section h3 { margin: 0 0 8px; font-size: 11px; color: #9a9790; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  .cardish { background: #101110; border: 1px solid #232422; border-radius: 8px; padding: 10px 12px; }
  .kv { display: grid; grid-template-columns: 150px 1fr; gap: 6px 12px; font-size: 12.5px; }
  @media (max-width: 520px) { .kv { grid-template-columns: 1fr; } }
  .k { color: #8f8c85; }
  .v { color: #e2ded5; word-break: break-word; }
  .score-big { font-size: 28px; font-weight: 700; color: #f2eee6; letter-spacing: -0.02em; }
  .sub { color: #9a9790; font-size: 12px; margin-top: 2px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #1c1d1b; border: 1px solid #2f302e; font-size: 11px; color: #cfcac0; margin-right: 6px; margin-top: 4px; }
  details.raw { margin-top: 6px; }
  details.raw summary { cursor: pointer; color: #8f8c85; font-size: 12px; }
  pre { margin: 8px 0 0; padding: 10px 12px; background: #0d0d0c; border: 1px solid #232422; border-radius: 6px; font-size: 11px; line-height: 1.45; color: #cfc5b8; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .muted { color: #7a7872; font-size: 12px; }
  .actions { display: flex; gap: 8px; align-items: center; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Scans</h1>
    <div class="meta" id="meta">Loading…</div>
  </div>
  <button id="refresh">Refresh</button>
</header>
<div class="error" id="error" hidden></div>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>
    <div style="margin-bottom:10px">No scans found.</div>
    <div style="font-size:12px;color:#7a7872;line-height:1.5;max-width:520px;margin:0 auto">
      On Vercel, scans persist via Blob (<code>BLOB_READ_WRITE_TOKEN</code>). Locally, scans save to the <code>scans/</code> folder when using <code>npm run dev</code>.
    </div>
  </div>
</main>

<div class="modal-backdrop" id="modal" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-label="Scan details">
    <div class="modal-head">
      <div class="title" id="modal-title"></div>
      <div class="actions">
        <a class="btn" id="modal-download" href="#" download>Download</a>
        <button id="modal-close" type="button">Close</button>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-img"><img id="modal-img" alt="" /></div>
      <div class="modal-info" id="modal-info"></div>
    </div>
  </div>
</div>

<script>
(function () {
  const grid = document.getElementById('grid')
  const empty = document.getElementById('empty')
  const metaEl = document.getElementById('meta')
  const errorEl = document.getElementById('error')
  const modal = document.getElementById('modal')
  const modalTitle = document.getElementById('modal-title')
  const modalImg = document.getElementById('modal-img')
  const modalInfo = document.getElementById('modal-info')
  const modalDownload = document.getElementById('modal-download')
  const modalClose = document.getElementById('modal-close')

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])) }
  function showError(msg){ errorEl.hidden = false; errorEl.textContent = msg }
  function fmtTime(iso, epoch){
    if(!iso && !epoch) return null
    const d = new Date(iso || epoch)
    if(isNaN(d.getTime())) return { raw: iso || epoch }
    return { iso: iso || d.toISOString(), epochMs: epoch || d.getTime(), utc: d.toUTCString(), local: d.toString() }
  }
  function kv(obj){
    const rows = Object.entries(obj || {}).filter(([,v])=>v !== undefined && v !== null && v !== '')
    if(!rows.length) return '<div class="muted">No data</div>'
    return '<div class="kv">' + rows.map(([k,v])=>`<div class="k">${esc(k)}</div><div class="v">${esc(typeof v === 'object' ? JSON.stringify(v) : v)}</div>`).join('') + '</div>'
  }
  function section(title, inner){ return `<div class="section"><h3>${esc(title)}</h3><div class="cardish">${inner}</div></div>` }

  function renderDetail(obj){
    const m = obj.meta && typeof obj.meta === 'object' ? obj.meta : null
    const sent = fmtTime(m && (m.sentAt || m.capturedAt || m.at), m && m.sentAtEpochMs)
    const res = m && m.result ? m.result : null
    const dev = m && m.device ? m.device : {}
    const net = m && m.network ? m.network : {}
    const geo = m && m.geo ? m.geo : {}
    const up = m && m.upload ? m.upload : {}

    let scoreHtml = '<div class="muted">No score recorded (scan saved before result logging, or analysis failed).</div>'
    if(res && res.ok){
      const cats = Array.isArray(res.categories) ? res.categories.map(c=>`<span class="pill">${esc(c.name)} ${esc(c.score)}</span>`).join('') : ''
      scoreHtml = `
        <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
          <div class="score-big">${esc(res.overall)}</div>
          <div><div style="font-weight:600;color:#f2eee6">${esc(res.band || '')} ${res.level ? '('+esc(res.level)+')' : ''}</div><div class="sub">Potential ${esc(res.potential)} · Confidence ${esc(res.confidence)} · Hair halo ${esc(res.hairHalo)}</div></div>
        </div>
        <div class="sub" style="margin-top:8px">Gender: ${esc(res.gender)} · Model: ${esc(res.provider)}/${esc(res.model)} · Structural ${esc(res.structuralIndex)} · Appeal ${esc(res.appealIndex)}</div>
        ${cats ? `<div style="margin-top:8px">${cats}</div>` : ''}
      `
    } else if (res && !res.ok) {
      scoreHtml = `<div class="muted">Result: ${esc(res.error || 'failed')}${res.message ? ' — '+esc(res.message) : ''}</div>`
    }

    const deviceSummary = dev.summary || [dev.uaModel && String(dev.uaModel).replace(/"/g,''), dev.platform && String(dev.platform).replace(/"/g,''), /Mobile/i.test(String(dev.userAgent||''))||dev.mobile==='?1'?'Mobile':'Desktop'].filter(Boolean).join(' · ')
    const loc = [geo.city, geo.region, geo.country].filter(Boolean).join(', ') + (geo.latitude && geo.longitude ? ` (${geo.latitude}, ${geo.longitude})` : '')
    const where = [up.referer, up.origin, up.fullUrl || (up.host && up.url ? (up.forwardedProto||'https')+'://'+up.host+up.url : '')].find(Boolean)

    const parts = []
    parts.push(section('Score', scoreHtml))
    parts.push(section('Sent time (exact)', sent ? kv({ sentAt: sent.iso, epochMs: sent.epochMs, utc: sent.utc, local: sent.local }) : '<div class="muted">No exact sent time recorded (saved before timestamp logging).</div>'))
    parts.push(section('Device / Phone', kv({ device: deviceSummary, platform: dev.platform, mobile: dev.mobile, model: dev.uaModel, ua: dev.ua, uaFullVersionList: dev.uaFullVersionList, platformVersion: dev.uaPlatformVersion, userAgent: dev.userAgent, language: dev.language, viewport: dev.viewportWidth, dpr: dev.dpr, deviceMemory: dev.deviceMemory, connection: dev.ect || dev.downlink ? (dev.ect||'') + (dev.downlink?(' '+dev.downlink+'Mbps'):'') : undefined })))
    parts.push(section('Location', kv({ location: loc || undefined, country: geo.country, region: geo.region, city: geo.city, latitude: geo.latitude, longitude: geo.longitude, timezone: geo.timezone, continent: geo.continent, ip: net.ip, xForwardedFor: net.xForwardedFor })))
    parts.push(section('Upload source (where it came from)', kv({ referer: up.referer, origin: up.origin, host: up.host, requestUrl: up.url, fullUrl: up.fullUrl, method: up.method, vercelId: up.vercelId, deploymentUrl: up.vercelDeploymentUrl })))
    parts.push(section('Scan', kv({ name: obj.name, pathname: obj.pathname, source: obj.source, size: obj.size, uploadedAt: obj.uploadedAt })))
    if(m){
      parts.push(`<div class="section"><div class="cardish"><details class="raw"><summary>Raw metadata (all captured)</summary><pre>${esc(JSON.stringify(m,null,2))}</pre></details></div></div>`)
    } else {
      parts.push(section('Metadata', '<div class="muted">No metadata recorded for this scan (saved before logging was enabled).</div>'))
    }
    return parts.join('')
  }

  function openModal(obj) {
    const src = obj.url || ('/api/scans?file=' + encodeURIComponent(obj.name || obj.pathname || ''))
    const name = obj.name || (obj.pathname || '').split('/').pop() || 'scan'
    modalTitle.textContent = name
    modalImg.src = src
    modalImg.alt = name
    modalDownload.href = src
    modalDownload.download = name
    modalInfo.innerHTML = renderDetail(obj)
    modal.classList.add('open')
    modal.setAttribute('aria-hidden', 'false')
  }

  function closeModal() {
    modal.classList.remove('open')
    modal.setAttribute('aria-hidden', 'true')
    modalImg.src = ''
  }

  modalClose.addEventListener('click', closeModal)
  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal() })
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal() })

  async function load() {
    errorEl.hidden = true
    grid.innerHTML = ''
    try {
      const res = await fetch('/api/scans')
      if (!res.ok) throw new Error('Failed to load: ' + res.status)
      const data = await res.json()
      metaEl.textContent = data.count + ' scan' + (data.count === 1 ? '' : 's') + ' — click an image for score, device, location, source & exact time'
      if (!data.scans.length) { empty.hidden = false; return }
      empty.hidden = true
      for (const item of data.scans) {
        const obj = typeof item === 'string' ? { name: item, url: '/api/scans?file=' + encodeURIComponent(item) } : item
        const src = obj.url || ('/api/scans?file=' + encodeURIComponent(obj.name || obj.pathname || ''))
        const name = obj.name || (obj.pathname || '').split('/').pop() || 'scan'
        const card = document.createElement('div')
        card.className = 'card'
        const img = document.createElement('img')
        img.src = src; img.alt = name; img.loading = 'lazy'; img.title = 'Click to view details'
        img.addEventListener('click', () => openModal(obj))
        const row = document.createElement('div')
        row.className = 'row'
        const span = document.createElement('div')
        span.className = 'name'
        span.textContent = name
        const btn = document.createElement('button')
        btn.textContent = 'Details'; btn.type = 'button'
        btn.addEventListener('click', () => openModal(obj))
        row.appendChild(span); row.appendChild(btn)
        card.appendChild(img); card.appendChild(row)
        grid.appendChild(card)
      }
    } catch (err) {
      showError('Could not load scans: ' + err.message)
      metaEl.textContent = '—'
    }
  }

  document.getElementById('refresh').addEventListener('click', load)
  load()
})()
</script>
</body>
</html>

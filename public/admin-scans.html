<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scans — Admin</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #101110; color: #e8e6e1; }
  header { padding: 20px 24px; border-bottom: 1px solid #2a2b29; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  .meta { color: #9a9790; font-size: 13px; margin-top: 4px; font-family: ui-monospace, monospace; }
  button { background: #1c1d1b; color: #e8e6e1; border: 1px solid #2f302e; border-radius: 6px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
  button:hover { background: #242523; }
  main { padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .card { background: #161716; border: 1px solid #2a2b29; border-radius: 8px; overflow: hidden; }
  .card img { width: 100%; height: auto; display: block; background: #0a0a0a; }
  .card .row { padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .name { font-size: 11px; font-family: ui-monospace, monospace; color: #9a9790; word-break: break-all; }
  .empty { color: #9a9790; padding: 48px 24px; text-align: center; font-size: 14px; }
  .error { color: #f0a08a; padding: 12px 24px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Scans</h1>
    <div class="meta" id="meta">Loading…</div>
  </div>
  <button id="refresh">Refresh</button>
</header>
<div class="error" id="error" hidden></div>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No scans found.</div>
</main>
<script>
(function () {
  const grid = document.getElementById('grid')
  const empty = document.getElementById('empty')
  const meta = document.getElementById('meta')
  const errorEl = document.getElementById('error')

  function showError(msg) {
    errorEl.hidden = false
    errorEl.textContent = msg
  }

  async function load() {
    errorEl.hidden = true
    grid.innerHTML = ''
    try {
      const res = await fetch('/api/scans')
      if (!res.ok) throw new Error('Failed to load: ' + res.status)
      const data = await res.json()
      meta.textContent = data.count + ' scan' + (data.count === 1 ? '' : 's') + ' found'
      if (!data.scans.length) {
        empty.hidden = false
        return
      }
      empty.hidden = true
      for (const name of data.scans) {
        const src = '/api/scans?file=' + encodeURIComponent(name)
        const card = document.createElement('div')
        card.className = 'card'
        const img = document.createElement('img')
        img.src = src
        img.alt = name
        img.loading = 'lazy'
        const row = document.createElement('div')
        row.className = 'row'
        const span = document.createElement('div')
        span.className = 'name'
        span.textContent = name
        const a = document.createElement('a')
        a.href = src
        a.download = name
        const btn = document.createElement('button')
        btn.textContent = 'Download'
        a.appendChild(btn)
        row.appendChild(span)
        row.appendChild(a)
        card.appendChild(img)
        card.appendChild(row)
        grid.appendChild(card)
      }
    } catch (err) {
      showError('Could not load scans: ' + err.message)
      meta.textContent = '—'
    }
  }

  document.getElementById('refresh').addEventListener('click', load)
  load()
})()
</script>
</body>
</html>

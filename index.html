<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F3EC" />
    <script>
      (function () {
        try {
          var theme = window.localStorage.getItem('kef-theme')
          if (theme !== 'light' && theme !== 'dark' && theme !== 'void') theme = 'light'
          document.documentElement.dataset.theme = theme
          var colors = { light: '#F6F3EC', dark: '#10110F', void: '#050605' }
          document.documentElement.style.background = colors[theme]
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', colors[theme])
        } catch (error) {
          // default light theme, no-op
        }
      })()
    </script>
    <meta
      name="description"
      content="One photo in. Get a 10-point read on structure, skin, hair, grooming and overall appeal, plus a realistic plan for what can actually change. One photo, one estimate."
    />
    <meta property="og:title" content="Kefmaxxing — An honest assessment of your facial features" />
    <meta
      property="og:description"
      content="One photo in. A 10-point read on structure, skin, hair, grooming and overall appeal, plus a realistic plan for what can actually change."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <title>Kefmaxxing — An honest assessment of your facial features</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

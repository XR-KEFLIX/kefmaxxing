<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F3EC" />
    <script>
      (function () {
        try {
          var theme = window.localStorage.getItem('kef-theme')
          if (theme !== 'light' && theme !== 'dark' && theme !== 'void') theme = 'light'
          document.documentElement.dataset.theme = theme
          var colors = { light: '#F6F3EC', dark: '#10110F', void: '#050605' }
          document.documentElement.style.background = colors[theme]
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', colors[theme])
        } catch (error) {
          // default light theme, no-op
        }
      })()
    </script>
    <meta
      name="description"
      content="Kefmaxxing is a multi-dimensional facial aesthetics analysis. One photo in, a transparent 10-point assessment across structure, skin, hair, grooming and overall appeal, plus a realistic improvement plan. Photos are not stored by this app."
    />
    <meta property="og:title" content="Kefmaxxing — Facial aesthetics, measured honestly" />
    <meta
      property="og:description"
      content="A transparent 10-point facial assessment across structure, presentation and overall appeal. Not a single internet score."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/blackpill.svg" />
    <title>Kefmaxxing — Facial aesthetics, measured honestly</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
